<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Estoque e ficha técnica | Forno Nobre</title>
<link rel="icon" href="assets/img/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/estoque.css" />
<script type="module" src="assets/js/estoque.js" defer></script>
</head>
<body>
<header class="es-topo">
  <a class="es-voltar" href="painel.html">← Painel</a>
  <h1>Estoque e ficha técnica</h1>
</header>

<div class="es-login" data-login hidden>
  <form data-form-login>
    <h2>Acesso da loja</h2>
    <input type="password" placeholder="Senha do painel" data-senha autocomplete="current-password" />
    <button type="submit">Entrar</button>
    <p class="es-erro" data-erro hidden></p>
  </form>
</div>

<main class="es-app" data-app hidden>
  <nav class="es-abas">
    <button class="on" data-aba="insumos">Insumos</button>
    <button data-aba="fichas">Fichas técnicas</button>
    <button data-aba="posicao">Posição e custo</button>
  </nav>

  <!-- INSUMOS -->
  <section data-painel="insumos">
    <h2>Insumos comprados</h2>
    <form class="es-form" data-form-insumo>
      <input placeholder="Nome (ex: Mussarela)" data-i-nome required />
      <input placeholder="Unidade (kg, un, L)" data-i-un required />
      <input type="number" step="0.01" placeholder="Custo por unidade (R$)" data-i-custo required />
      <input type="number" step="0.01" placeholder="Qtd em estoque" data-i-qtd />
      <button type="submit">Salvar insumo</button>
    </form>
    <div class="es-lista" data-lista-insumos></div>
  </section>

  <!-- FICHAS -->
  <section data-painel="fichas" hidden>
    <h2>Ficha técnica do produto</h2>
    <form class="es-form" data-form-ficha>
      <input placeholder="Nome do produto (ex: Pizza Mussarela Grande)" data-fc-nome required />
      <input type="number" step="0.01" placeholder="Preço de venda (R$)" data-fc-preco required />
      <div data-ficha-itens class="es-ficha-itens"></div>
      <button type="button" class="es-add" data-add-ingrediente>+ Adicionar ingrediente</button>
      <button type="submit">Salvar ficha</button>
    </form>
    <div class="es-lista" data-lista-fichas></div>
  </section>

  <!-- POSICAO -->
  <section data-painel="posicao" hidden>
    <h2>Posição de estoque e custo do prato</h2>
    <div class="es-lista" data-posicao></div>
  </section>
</main>
</body>
</html>
